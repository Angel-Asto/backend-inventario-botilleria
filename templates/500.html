<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Error del sistema | Botillería</title>
  <style>
    body{font-family:system-ui,"Segoe UI",sans-serif;background:#f8fafc;color:#0f172a;display:grid;place-items:center;min-height:100vh;margin:0;padding:1rem}
    .caja{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:2rem;max-width:420px;text-align:center}
    a{display:inline-block;margin-top:1rem;background:#0f766e;color:#fff;padding:.5rem 1rem;border-radius:6px;text-decoration:none}
  </style>
</head>
<body>
  <div class="caja">
    <h1>Ocurrió un error</h1>
    <p>No se pudo completar la operación. Ningún cambio quedó a medias. Intenta de nuevo; si el problema sigue, avisa al administrador.</p>
    <a href="/">Volver al inicio</a>
  </div>
</body>
</html>
