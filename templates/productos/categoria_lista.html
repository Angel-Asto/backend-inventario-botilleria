{% extends 'base.html' %}
{% block titulo %}Categorías | Botillería{% endblock %}
{% block contenido %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3 m-0">Categorías</h1>
  <a class="btn btn-acc" href="{% url 'productos:categoria_crear' %}"><i class="bi bi-plus-lg"></i> Nueva categoría</a>
</div>
<div class="table-responsive"><table class="table align-middle">
  <thead><tr><th>Categoría</th><th class="text-end">Acciones</th></tr></thead>
  <tbody>
  {% for c in object_list %}
    <tr>
      <td>{{ c.nombre }}</td>
      <td class="text-end">
        <a class="btn btn-sm btn-outline-primary" href="{% url 'productos:categoria_editar' c.pk %}"><i class="bi bi-pencil-square"></i></a>
        <a class="btn btn-sm btn-outline-danger" href="{% url 'productos:categoria_eliminar' c.pk %}"><i class="bi bi-trash3"></i></a>
      </td>
    </tr>
  {% empty %}
    <tr><td colspan="2" class="text-center text-muted py-4">No hay categorías registradas.</td></tr>
  {% endfor %}
  </tbody>
</table></div>
<a class="btn btn-outline-secondary" href="{% url 'productos:lista' %}">Volver a productos</a>
{% endblock %}
