{% extends 'base.html' %}
{% block titulo %}Eliminar | Botillería{% endblock %}
{% block contenido %}
<h1 class="h3 mb-3">Eliminar categoría</h1>
<div class="col-md-7"><div class="card"><div class="card-body">
  <p>¿Seguro que quieres eliminar <b>{{ object }}</b>? Esta acción no se puede deshacer.</p>
  <form method="post">{% csrf_token %}
    <button class="btn btn-danger" type="submit">Sí, eliminar</button>
    <a class="btn btn-outline-secondary" href="{% url 'productos:categoria_lista' %}">Cancelar</a>
  </form>
</div></div></div>
{% endblock %}
