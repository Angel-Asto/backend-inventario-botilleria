{% extends 'base.html' %}
{% block titulo %}Proveedor | Botillería{% endblock %}
{% block contenido %}
<h1 class="h3 mb-3">{% if object %}Editar proveedor{% else %}Nuevo proveedor{% endif %}</h1>
<form method="post" class="card card-body">
  {% csrf_token %}
  {% include 'includes/campos.html' %}
  <div class="d-flex gap-2">
    <button class="btn btn-acc">Guardar</button>
    <a class="btn btn-outline-secondary" href="{% url 'compras:proveedor_lista' %}">Cancelar</a>
  </div>
</form>
{% endblock %}
