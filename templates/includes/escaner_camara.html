{% load static %}
{# Panel de la cámara para escanear códigos. Se conecta con EscanerCamara.conectar() desde la página. #}
<div id="panel-camara" class="mt-3 d-none">
  <div id="lector" data-lector class="border rounded overflow-hidden mx-auto" style="max-width:420px"></div>
  <div class="d-flex justify-content-between align-items-center mt-2 mx-auto" style="max-width:420px">
    <small class="text-muted" data-estado>Apunta al código de barras o QR.</small>
    <button type="button" class="btn btn-sm btn-outline-secondary" data-cerrar>Cerrar cámara</button>
  </div>
</div>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"
        integrity="sha384-c9d8RFSL+u3exBOJ4Yp3HUJXS4znl9f+z66d1y54ig+ea249SpqR+w1wyvXz/lk+" crossorigin="anonymous"></script>
<script src="{% static 'js/escaner_camara.js' %}?v=2"></script>{# súbelo cada vez que cambie el JS #}
